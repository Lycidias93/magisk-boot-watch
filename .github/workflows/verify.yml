name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: webui-core/go.mod
          cache: false
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl python3 zip unzip
      - name: Verify vNext
        run: ./tools/verify-vnext.sh
      - name: Build deterministic candidate
        run: ./tools/build-vnext.sh
      - uses: actions/upload-artifact@v6
        with:
          name: boot-watch-vnext
          path: |
            dist/boot-watch-0.2.11-vnext.1.zip
            dist/vnext-build-manifest.json
          if-no-files-found: error
          retention-days: 14

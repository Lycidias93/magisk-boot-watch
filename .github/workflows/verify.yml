name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release zip when present
        run: |
          set -euo pipefail
          if [ -f releases/v0.2.0/magisk-boot-watch-v0.2.0.zip ]; then
            bash tools/verify-magisk-boot-watch-v0.2.0.sh releases/v0.2.0/magisk-boot-watch-v0.2.0.zip
          fi
          find src/magisk-module -name '*.sh' -print0 | xargs -0 -r sh -n

name: materialize-webui-pilot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'repo-maintenance/webui-core-v02-pilot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Boot Watch branch
        uses: actions/checkout@v5
        with:
          ref: repo-maintenance/webui-core-v02-pilot
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout pinned shared WebUI core
        uses: actions/checkout@v5
        with:
          repository: Lycidias93/android-root-module-webui-template
          ref: cdb872d2afb9f86300dd26f6474820ab5de3efca
          fetch-depth: 1
          path: .webui-template
          persist-credentials: false
      - name: Materialize exact shared core
        run: |
          set -euo pipefail
          bash ./tools/materialize-webui-pilot.sh "$GITHUB_WORKSPACE/.webui-template"
      - name: Commit materialized source
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "RESULT: BOOT_WATCH_WEBUI_MATERIALIZE_NOOP"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'pilot: materialize shared WebUI core 0.2.1'
          git push origin HEAD:repo-maintenance/webui-core-v02-pilot
